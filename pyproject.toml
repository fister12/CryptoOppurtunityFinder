[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-agents"
version = "0.1.0"
description = "Hermes agents framework for crypto prediction trading on Polymarket and Kalshi"
requires-python = ">=3.10"
dependencies = [
    "aiosqlite>=0.20.0",
    "apify-client>=1.8.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "openai>=1.40.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.8.0",
    "torch>=2.0.0",
    "einops>=0.8.0",
    "huggingface-hub>=0.20.0",
    "safetensors>=0.4.0",
    "tenacity>=8.3.0",
    "structlog>=24.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
hermes = [
    "hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
include = ["agents*", "core*", "models*", "utils*", "api*"]

[project.scripts]
crypto-trader = "main:main"
